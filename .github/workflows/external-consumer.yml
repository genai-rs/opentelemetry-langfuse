name: External consumer

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_BUILD_JOBS: 2

jobs:
  consumer:
    name: External consumer (Rust 1.93.1)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      # The toolchain is the crate's MSRV, read from Cargo.toml so that dependency bots cannot move it.
      # The job name is a required status check, so it names the MSRV literally; this step fails when
      # the two drift apart (then update the name here and in the branch protection).
      - name: MSRV from Cargo.toml
        id: msrv
        run: |
          msrv=$(sed -n 's/^rust-version *= *"\(.*\)"/\1/p' Cargo.toml | head -n 1)
          test -n "$msrv"
          echo "version=$msrv" >> "$GITHUB_OUTPUT"
          if [ "Rust $msrv" != "Rust 1.93.1" ]; then
            echo "::error::rust-version is $msrv but the job is named for 1.93.1; rename the job and the required check"
            exit 1
          fi
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: examples/external-consumer
      - name: Check fixture formatting
        run: cargo fmt --manifest-path examples/external-consumer/Cargo.toml -- --check
      - name: Compile the independent consumer at MSRV
        run: cargo check --manifest-path examples/external-consumer/Cargo.toml
      - name: Export to a local fake endpoint and shut down
        run: cargo run --manifest-path examples/external-consumer/Cargo.toml
      - name: Inspect SDK dependency versions
        run: cargo tree --manifest-path examples/external-consumer/Cargo.toml -i opentelemetry_sdk
